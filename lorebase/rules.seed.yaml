# Default laws and social roles of the world, loaded into Lorebase by `npm run lorebase:seed`.
# This file is the only place where gameplay numbers have defaults; the simulation reads the
# live values from Lorebase. Texts are what the people of the world read (Italian).
rules:
  - code: max_hp
    value: 10
    unit: salute
    category: survival
    text: "Ogni persona ha al massimo questa salute. Con la salute a zero si muore."
  - code: food_per_tick
    value: 1
    unit: fame/turno
    category: survival
    text: "A ogni turno la fame di ogni persona cresce di questa quantità. Mangiare un cibo toglie uno di fame."
  - code: starvation_threshold
    value: 4
    unit: fame
    category: survival
    text: "Quando la fame supera questo livello si comincia a morire di fame."
  - code: starvation_damage
    value: 2
    unit: salute/turno
    category: survival
    text: "Chi muore di fame perde questa salute a ogni turno."
  - code: rest_heal
    value: 1
    unit: salute
    category: survival
    text: "Riposare restituisce questa salute, ma solo a chi non sta morendo di fame."
  - code: actions_per_tick
    value: 2
    unit: azioni
    category: society
    text: "A ogni turno una persona può compiere questo numero di azioni (muoversi, raccogliere, costruire, dare, riposare). Guardare, mangiare e parlare non costano azioni."
  - code: gather_food_yield
    value: 2
    unit: cibo
    category: economy
    text: "Raccogliere cibo prende fino a questa quantità di cibo dalla casella su cui ci si trova."
  - code: gather_wood_yield
    value: 2
    unit: legna
    category: economy
    text: "Raccogliere legna prende fino a questa quantità di legna dalla casella su cui ci si trova."
  - code: regrowth_per_tick
    value: 0.08
    unit: quota/turno
    category: economy
    text: "A ogni turno la terra ricresce di questa quota del cibo e della legna che può naturalmente portare."
  - code: shelter_wood_cost
    value: 6
    unit: legna
    category: economy
    text: "Costruire un rifugio sulla propria casella costa questa legna. Chiunque stia su una casella con un rifugio è al riparo."
  - code: winter_every_ticks
    value: 16
    unit: turni
    category: climate
    text: "Un anno dura questo numero di turni; l'ultima parte di ogni anno è inverno."
  - code: winter_length_ticks
    value: 4
    unit: turni
    category: climate
    text: "L'inverno dura questo numero di turni alla fine di ogni anno."
  - code: winter_food_yield_multiplier
    value: 0.5
    unit: x
    category: climate
    text: "D'inverno la raccolta e la ricrescita sono moltiplicate per questo fattore."
  - code: cold_damage_unsheltered
    value: 1
    unit: salute/turno
    category: climate
    text: "D'inverno chi non sta su un rifugio perde questa salute a ogni turno."
  - code: birth_food_cost
    value: 6
    unit: cibo
    category: society
    text: "Due persone sazie sulla stessa casella con rifugio che insieme portano questo cibo mettono al mondo un figlio, consumando quel cibo (al massimo una volta all'anno ciascuna)."
  - code: sharing_allowed
    value: 1
    unit: 0/1
    category: society
    text: "Se vale 1, si può dare cibo e legna a chi sta sulla stessa casella o su una adiacente. Se vale 0, dare è vietato."
  - code: vision_radius
    value: 3
    unit: caselle
    category: society
    text: "Una persona vede caselle e persone entro questo numero di caselle."
  # Real-time world (npm run game). The tick-based dashboard ignores these.
  - code: game_minutes_per_real_second
    value: 1
    unit: minuti/secondo
    category: time
    text: "Per ogni secondo che passa fuori dal mondo, nel mondo passano questi minuti."
  - code: turn_minutes
    value: 30
    unit: minuti
    category: time
    text: "Un turno dura questi minuti. Le leggi espresse per turno (fame, freddo, guarigione, ricrescita, stagioni) valgono per ogni turno."
  - code: dawn_minute
    value: 360
    unit: minuto del giorno
    category: time
    text: "Il giorno ha 1440 minuti; a questo minuto sorge il sole."
  - code: dusk_minute
    value: 1260
    unit: minuto del giorno
    category: time
    text: "A questo minuto del giorno cala la notte."
  - code: plan_horizon_minutes
    value: 30
    unit: minuti
    category: time
    text: "Chi decide cosa fare immagina circa questi minuti del proprio futuro."
  - code: replan_cooldown_minutes
    value: 20
    unit: minuti
    category: time
    text: "Dopo aver deciso, una persona ci ripensa al più presto dopo questi minuti, salvo imprevisti gravi."
  - code: base_move_speed
    value: 1.5
    unit: caselle/minuto
    category: society
    text: "Una persona in salute cammina di queste caselle al minuto; il ruolo può renderla più rapida o più lenta. Acqua e roccia non si attraversano."
  - code: base_work_speed
    value: 1
    unit: x
    category: economy
    text: "Rapidità di base del lavoro (raccogliere, costruire); il ruolo può renderla maggiore o minore."
  - code: gather_minutes
    value: 4
    unit: minuti
    category: economy
    text: "Raccogliere una volta richiede questi minuti di lavoro a rapidità di base."
  - code: build_minutes
    value: 20
    unit: minuti
    category: economy
    text: "Costruire o ampliare un rifugio richiede questi minuti di lavoro a rapidità di base."
  - code: eat_minutes
    value: 1
    unit: minuti
    category: survival
    text: "Mangiare richiede questi minuti."
  - code: weak_speed_factor
    value: 0.5
    unit: x
    category: survival
    text: "Chi ha poca salute è più lento: con la salute quasi a zero si muove e lavora a questa frazione della propria rapidità."
  - code: critical_hunger
    value: 3
    unit: fame
    category: survival
    text: "Quando la fame raggiunge questo livello la si sente forte."
  - code: critical_hp_fraction
    value: 0.3
    unit: quota
    category: survival
    text: "Quando la salute scende sotto questa quota del massimo ci si sente in pericolo."
  - code: speech_radius
    value: 4
    unit: caselle
    category: society
    text: "Le parole si sentono fino a questo numero di caselle di distanza."
  - code: max_shelter_level
    value: 2
    unit: livelli
    category: economy
    text: "Un rifugio può essere ampliato fino a questo livello; ogni livello costa la legna di un rifugio."
  - code: shelter_decay_per_day
    value: 0.25
    unit: livelli/giorno
    category: economy
    text: "I rifugi si degradano: ogni giorno perdono questa parte di un livello, finché qualcuno non li ripara costruendo di nuovo."
  - code: wild_distance
    value: 9
    unit: caselle
    category: survival
    text: "Oltre questa distanza dal cuore del mondo cominciano le terre selvagge."
  - code: wild_damage
    value: 0.5
    unit: salute/turno
    category: survival
    text: "Nelle terre selvagge chi non sta su un rifugio perde questa salute a ogni turno."
  - code: experiment_minutes
    value: 15
    unit: minuti
    category: economy
    text: "Sperimentare combinando delle cose richiede questo tempo di lavoro; le cose combinate si consumano, una per tipo."
  - code: use_minutes
    value: 2
    unit: minuti
    category: survival
    text: "Usare una medicina o un oggetto simile richiede questo tempo."
  - code: offer_minutes
    value: 60
    unit: minuti
    category: society
    text: "Una proposta di scambio resta valida per questo tempo, poi decade."
  - code: season_turn_minutes
    value: 1440
    unit: minuti
    category: time
    text: "Nel mondo che scorre senza pause le stagioni contano i turni dell'anno in giorni: un turno dell'anno dura questi minuti."
  - code: tool_wear_per_use
    value: 1
    unit: usi
    category: economy
    text: "Ogni volta che un attrezzo viene usato perde questa durata; a zero si rompe."

roles:
  - code: gatherer
    move_factor: 1.0
    work_factor: 1.25
    title: Raccoglitore
    description: "Nella società sei chi conosce la terra: dove cresce il cibo e come trovarlo."
  - code: builder
    move_factor: 0.9
    work_factor: 1.3
    title: Costruttore
    description: "Nella società sei chi sa costruire: la legna, i rifugi, le cose che durano."
  - code: explorer
    move_factor: 1.35
    work_factor: 0.9
    title: Esploratore
    description: "Nella società sei chi si spinge lontano e vede ciò che gli altri non vedono."
  - code: elder
    move_factor: 0.8
    work_factor: 0.9
    title: Anziano
    description: "Nella società sei chi ha visto molti inverni; quando parli, gli altri ascoltano."
  - code: healer
    move_factor: 1.0
    work_factor: 1.0
    title: Guaritore
    description: "Nella società sei chi si prende cura degli altri e si accorge di chi è debole, affamato o ferito."
  - code: crafter
    move_factor: 0.95
    work_factor: 1.3
    title: Artigiano
    description: "Nella società sei chi sa trasformare la pietra, le fibre e il legno in oggetti e attrezzi."
